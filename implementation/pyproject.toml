# Formatting and import-order settings for implementation/ (black, isort).

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
known_first_party = [
    "analyze",
    "cascade",
    "energy",
    "frontier",
    "gsm8k",
    "load_modes",
    "measure",
    "olt_energy",
    "olt_load",
    "routing",
    "simulate",
]
force_sort_within_sections = false
order_by_type = false
skip_glob = ["**/.venv*/**"]
