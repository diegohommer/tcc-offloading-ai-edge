# Layer energy tables, transcribed from the TCC master document, section 6.
# All numbers are measured values from published sources, calibrated to
# decoder-LLM decode-phase inference (0.5B-70B+ class models). They do NOT
# describe the tiny encoder classifiers (66M-355M params) shipped by
# default in src/recserve/vendor -- see src/recserve/vendor/NOTICE.md and
# the root README for that caveat.
#
# Locked base (section 4): phase=decode, batch=1 where available, boundary
# = chip/module (no PUE), unit = J per output token. Free variable:
# precision. Fog/cloud batch=1 is not available in the literature surveyed;
# their "isolated_query" / "production" regimes are used instead, each
# tagged with its own batch so nothing gets silently compared across
# incompatible regimes.

meta:
  base:
    phase: decode
    boundary: chip_or_module
    unit: J_per_output_token
    free_variable: precision

layers:
  user:
    hardware: "Snapdragon 8 Elite Gen 5 (SM8850) - OnePlus 15 / Xiaomi 17"
    source: "Cai et al., Is Your NPU Ready for LLMs?, arXiv:2607.05475"
    regime: "batch=1, decode isolated from prefill, device cooled, airplane mode, repeated trials"
    models:
      llama3.2_1b:
        precision: W4
        decode_J_per_token: {cpu: 0.074, gpu_adreno: 0.11, npu_hexagon_mllm: 0.086}
        best_backend_decode: cpu
        decode_throughput_tok_s: {cpu: 72}
      qwen2.5_1.5b:
        precision: W4
        decode_J_per_token: {cpu: 0.097, gpu_adreno: 0.14, npu_hexagon_mllm: 0.087}
        best_backend_decode: cpu
      llama3.2_3b:
        precision: W4
        decode_J_per_token: {cpu: 0.21, gpu_adreno: 0.25, npu_hexagon_genie: 0.71}
        best_backend_decode: cpu
        decode_throughput_tok_s: {cpu: 31}
    notes: >
      Prefill costs 1-2 orders of magnitude less than decode and runs best
      on NPU (>2000 tok/s for the 1B model), but no exact prefill J/token
      value is tabulated in the source. Report by best backend per phase.

  onu:
    hardware: "NVIDIA Jetson AGX Orin 64GB, 204.8 GB/s, MAXN"
    source: "Kubwimana and Huang (NVIDIA), EdgeReasoning, arXiv:2511.01866"
    regime: "batch=1, vLLM, prefill/decode measured separately via tegrastats/jtop, Zenodo artifact"
    models:
      qwen2.5_1.5b:
        decode_J_per_token: {fp16: 0.51, w4: 0.22}
        decode_throughput_tok_s: {fp16: 38, w4: 74}
      llama3.1_8b:
        decode_J_per_token: {fp16: 2.71, w4: 0.98}
        decode_throughput_tok_s: {fp16: 9.0, w4: 26}
      qwen2.5_14b:
        decode_J_per_token: {fp16: 5.30, w4: 1.89}
        decode_throughput_tok_s: {fp16: 5.0, w4: 15}
    notes: >
      Decode dominates >=99% of time and energy (prefill:decode latency
      ratio 1:192 to 1:569); confirms the memory-bound regime (FLOPs:bytes
      ~1375 on Orin). Relevant range for the ONU layer is 1.5B-8B.

  fog:
    hardware_class: "T4 / L4 / A30 / A2 / A16 / L40S -- any edge-datacenter class GPU with the best available measurement for a 7-13B model"
    primary_source: "Watt Counts, arXiv:2604.09048 (A30 PCIe 24GB, 165W TDP, NVML @10Hz, GPU boundary, 16-bit)"
    primary_point:
      hardware: A30
      model: SOLAR-10.7B-Instruct
      decode_J_per_token: 0.3785
      caveats:
        - "batch=1000 server scenario, not decode-isolated"
        - "no phase separation"
        - "outlier flagged by Watt Counts authors: 21GB model near the 24GB card limit"
    cross_check:
      source: "WattGPU, arXiv:2607.02391 (predictive model built on the Watt Counts dataset, not an independent new measurement; read via alphaxiv.org mirror)"
      hardware: A30
      model: "Llama 3.1 8B"
      decode_J_per_token_upper_bound: 0.625
      derivation: "25W (Figure 1 mean power at the ITL<=25ms SLA filter) * 0.025s -- the 25ms is an SLA threshold used to filter which GPUs are 'viable' on the chart, not a measured ITL, so this is a ceiling, not a point estimate."
      note: "Supports the memory-pressure-outlier reading: an 8B model that fits comfortably in 24GB comes in well under the SOLAR-10.7B point."
    batch_curve_source: "Fadel Argerich and Patino-Martinez, Measuring and Improving the Energy Efficiency of Large Language Models Inference, IEEE Access vol. 12, 2024, DOI 10.1109/ACCESS.2024.3409745 (open access, CC BY 4.0). Batch=1 values read from Figure 4; batch=5/10/20 values read from Figure 6, Section VI-C ('Batch size')."
    batch_curve_regime: "FP16, HuggingFace Transformers/PyTorch backend (not vLLM, unlike primary_point/cross_check above), short prompts (<10 tokens) sampled from The Pile, up to 100 output tokens, 10 repeated trials per config, EnergyMeter tool (RAPL+NVML+eBPF); batch = number of concurrent prompts"
    batch_curve_caveats:
      - "Hardware is a desktop/workstation NVIDIA GeForce RTX 4090 24GB (Ada Lovelace, 450W TDP), which is NOT in the T4/L4/A30/A2/A16/L40S hardware_class list above -- included because Watt Counts/WattGPU (this file's primary fog sources) were searched specifically for a multi-batch sweep on fog-class hardware and yielded none (Watt Counts' 'batch scenario' is fixed at batch=1000 only; its server-scenario Tables 5-6 report mean power by Poisson arrival-rate load but no throughput, so J/token is not derivable; WattGPU's Figure 1 is a single ITL=25ms SLA point). RTX 4090 is the same architecture generation as L40S and is itself benchmarked alongside A30/L4/T4 as a peer-tier card in Watt Counts' Tables 5-6, so it is used here as the best real (non-fabricated) multi-batch dataset found for a 7B-class model."
      - "decode_J_per_token values are TOTAL node energy (cpu_per_token + gpu_per_token + dram_per_token stacked in the source figures), not chip/module-isolated GPU energy -- same node-vs-chip boundary caveat as the MLPerf point in the cloud block below; do not blend numerically with primary_point/cross_check without adjusting for boundary."
      - "Figure 6's batch=1 printed labels for dollyv2-7b (7.63) and RedPajama-INCITE-7B (8.53) match Figure 4's independently-labeled batch=1 values exactly, and Section VI-C's prose ('Bloom 7B... ending up with a similar performance to RedPajama-INCITE-BASE-7B when both use a batch size of 20') matches the read digits (Bloom 2.86 vs RedPajama 2.90 at batch=20) -- used as a cross-check that the printed bar-label digits were read correctly."
      - "The companion batch curve for pythia-6.9b in the same paper's Figure 5 (batch 1/5/10/20/40/100, would have extended the range further) was inspected but its six cramped subplots could not be read with confidence; excluded per the no-eyeballing-unlabeled-charts rule already applied to the fog 'pending' entry below."
      - "Llama-2-7b-chat-hf's Figure 6 panel was also inspected but its printed labels were not legible with confidence; excluded for the same reason."
    batch_curve:
      - hardware: RTX_4090
        model: "Dolly v2-7b (6.86B)"
        batch: 1
        decode_J_per_token: 7.63
      - hardware: RTX_4090
        model: "RedPajama-INCITE-7B-Base (6.86B)"
        batch: 1
        decode_J_per_token: 8.53
      - hardware: RTX_4090
        model: "Bloom-7b1 (7.07B)"
        batch: 1
        decode_J_per_token: 5.73
      - hardware: RTX_4090
        model: "Dolly v2-7b (6.86B)"
        batch: 5
        decode_J_per_token: 3.16
      - hardware: RTX_4090
        model: "RedPajama-INCITE-7B-Base (6.86B)"
        batch: 5
        decode_J_per_token: 3.38
      - hardware: RTX_4090
        model: "Bloom-7b1 (7.07B)"
        batch: 5
        decode_J_per_token: 3.03
      - hardware: RTX_4090
        model: "Dolly v2-7b (6.86B)"
        batch: 10
        decode_J_per_token: 2.98
      - hardware: RTX_4090
        model: "RedPajama-INCITE-7B-Base (6.86B)"
        batch: 10
        decode_J_per_token: 3.00
      - hardware: RTX_4090
        model: "Bloom-7b1 (7.07B)"
        batch: 10
        decode_J_per_token: 2.80
      - hardware: RTX_4090
        model: "Dolly v2-7b (6.86B)"
        batch: 20
        decode_J_per_token: 2.74
      - hardware: RTX_4090
        model: "RedPajama-INCITE-7B-Base (6.86B)"
        batch: 20
        decode_J_per_token: 2.90
      - hardware: RTX_4090
        model: "Bloom-7b1 (7.07B)"
        batch: 20
        decode_J_per_token: 2.86
        note: "Ticks up slightly from batch=10 (2.80) -- paper attributes this to Bloom-7b1 already reaching ~99% GPU utilization by batch=5-10, after which a larger batch offers no further parallelism headroom (Section VI-C)."
    pending:
      source: "Wilhelm, Wittkopp and Kao, Beyond Test-Time Compute Strategies, arXiv:2603.20224 / EuroMLSys'25 (L40S, batch=1 explicit, Llama 8B)"
      status: "Full text confirmed read (HTML and all 8 PDF pages, not just abstract): Figure 3 ('Non-linear behavior in token generation', log2 x-axis over 1-128 generated tokens) is a rendered chart with no backing data table. Table 1 gives only aggregate kJ totals per MMLU category for Llama 1B vs 8B (single-output-token queries, prefill+decode combined, per-category sample count not stated), which does not reduce to a comparable decode J/token at batch=1. No GitHub/Zenodo artifact with raw numbers was found (checked for a repo under the authors' names and the TU Berlin DOS group). No later work was found quoting this specific number in prose (TokenPowerBench, arXiv:2512.03024, does not cite this paper; Grokipedia's 'Energy per Token' page returned HTTP 403 on fetch). Per instructions, eyeballing bar/line heights off the chart image is excluded as a source -- still top fog priority (see section 11 of the master doc)."

  cloud:
    hardware_class: "A100 / H100 / B200 -- any hyperscale class GPU with the best available measurement for a 65B+ model"
    isolated_query_regime:
      source: "Samsi et al., arXiv:2310.03003"
      hardware: A100
      batch: 64
      decode_J_per_token_range: [3, 4]
      note: "batch=1 is not published anywhere in the literature surveyed for this GPU class; treated as the closest available point to an isolated-query regime."
    production_regime:
      source: "Oviedo et al. (Joule), arXiv:2509.20241, Table 1, Llama 3.1 70B"
      ml_energy_v3:
        J_per_query: 144
        Wh_per_query: 0.04
        hardware: 4xH100
        precision: BF16
        avg_output_tokens: 361
        derived_J_per_token: 0.3989
      caravaca_2025:
        J_per_query: 180
        Wh_per_query: 0.05
    out_of_production_regime:
      source: "AI Energy Score (2025), same table"
      J_per_query: 3636
      Wh_per_query: 1.01
      note: "No batching, no serving engine -- ~20-25x more expensive per query than the production regime for the same model."
    unconfirmed:
      description: "218 mJ/token analytical estimator, searched for in From Tokens to Watt-hours (arXiv:2607.26571) and the Joule paper; not found in either. Excluded until the source is located."
    mlperf_power_regime:
      source: "MLPerf Inference v5.1 (MLCommons), closed/datacenter, submitter Lenovo, github.com/mlcommons/inference_results_v5.1, opened directly via the GitHub API/raw content (not the results viewer)"
      hardware: "Lenovo ThinkSystem SR680a V3, 8x NVIDIA B200-SXM-180GB (node total; power measured at the PDU with the SPEC PTD analyzer, not per-chip)"
      precision: "weight_data_types=fp4 (NVFP4 quantization + affine fusion), input_data_types=int32 -- from the submission's measurements/.../SR680a_V3_B200SXMx8_TRT_Offline.json"
      benchmark: "llama2-70b-99 (99% accuracy constraint), batch >> 1 (not batch=1) in both scenarios below"
      offline:
        avg_power_W: 9653.48
        tokens_per_s: 102909
        decode_J_per_token: 0.0938
      server:
        avg_power_W: 9606.74
        tokens_per_s: 99159.27
        decode_J_per_token: 0.0969
      derivation: "decode_J_per_token = testing-phase 'Avg watts' (performance/power/ptd_logs.txt) / 'Tokens per second' or 'Completed tokens per second' (performance/run_1/mlperf_log_summary.txt), same power/throughput method as the fog-tier WattGPU cross_check above."
      caveats:
        - "Node-level power draw (8 GPUs plus host CPU/memory/PSU losses), not chip-isolated -- not directly comparable to the chip/module-boundary points used elsewhere in this file."
        - "FP4 is an aggressive low-precision format unique to Blackwell-class GPUs; this alone makes the value far below the BF16/FP16 cloud-tier points above, independent of the batch>>1 effect."
      verified_files:
        - "https://github.com/mlcommons/inference_results_v5.1/blob/main/closed/Lenovo/results/SR680a_V3_B200SXMx8_TRT/llama2-70b-99/Offline/performance/power/ptd_logs.txt"
        - "https://github.com/mlcommons/inference_results_v5.1/blob/main/closed/Lenovo/results/SR680a_V3_B200SXMx8_TRT/llama2-70b-99/Offline/performance/run_1/mlperf_log_summary.txt"
        - "https://github.com/mlcommons/inference_results_v5.1/blob/main/closed/Lenovo/results/SR680a_V3_B200SXMx8_TRT/llama2-70b-99/Server/performance/power/ptd_logs.txt"
        - "https://github.com/mlcommons/inference_results_v5.1/blob/main/closed/Lenovo/results/SR680a_V3_B200SXMx8_TRT/llama2-70b-99/Server/performance/run_1/mlperf_log_summary.txt"
        - "https://github.com/mlcommons/inference_results_v5.1/blob/main/closed/Lenovo/measurements/SR680a_V3_B200SXMx8_TRT/llama2-70b-99/Offline/SR680a_V3_B200SXMx8_TRT_Offline.json"

link:
  description: "ONU/PON access-network hop energy -- three orders of magnitude below inference terms, second-order for routing decisions."
  onu_power_active_W: 3.98
  onu_power_dozing_W: 1.2
  onu_power_sleep_W: 0.4
  onu_share_of_ftth_consumption_pct: 60
  per_hop_energy_J: 0.1
  sources:
    - "Loading-Aware TDMA Sleep (MDPI Sustainability), https://www.mdpi.com/2071-1050/14/16/10238"
    - "Sarigiannidis et al., IET Networks 2016, https://ietresearch.onlinelibrary.wiley.com/doi/10.1049/iet-net.2015.0087"
    - "FTTH EE analysis (PMC), https://pmc.ncbi.nlm.nih.gov/articles/PMC12526558/"

environment:
  pue:
    hyperscale: 1.1
    average: 1.5
  applies_to: [fog, cloud]
