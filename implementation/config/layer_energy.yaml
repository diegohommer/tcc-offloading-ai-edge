    batch_curve_source: "Caravaca, A. Cuevas and R. Cuevas, From Prompts to Power: Measuring the Energy Footprint of LLM Inference, arXiv:2511.05597 (same author group as the production_regime 'caravaca_2025' AI Energy Score row above). The Llama-3.1-405B batch=1-vs-100 numbers are quoted prose in Section IV-B ('Batch size', discussing Figure 3); the per-model batch=1 ('Energy1' column) vs optimized-batch ('Energy' column) numbers are read from Table IV ('Summary of models tested'). Both were verified against the raw arXiv HTML text (arxiv.org/html/2511.05597), not just a summarization pass, to avoid the GPU-mislabeling risk documented in the caveats below."
    batch_curve_regime: "vLLM continuous batching, GPU-only energy metering via CodeCarbon/NVML (chip/module boundary, matching this file's declared base). All prompts are P(300 T_input, 300 T_out) -- 300 output tokens each. Precision/quantization is not stated in the sections read (framework default, presumably BF16/FP16). 'batch=1' = the Energy1 column / single-prompt case in Table IV, or the explicit single-prompt case in Section IV-B; 'optimized' = the Energy column, the paper's best-found batching configuration -- Table IV never states this as a specific integer batch size (only the Section IV-B prose gives one explicit intermediate point, batch=100, for Llama-3.1-405B)."
    batch_curve_caveats:
      - "decode_J_per_token here = (Wh * 3600) / 300 output tokens; the paper reports no prefill/decode split ('no separate prefill/decode phase breakdown reported due to continuous batching'), so this over-counts decode alone by an unknown prefill share -- the same no-phase-separation caveat already applied to the fog RTX_4090 batch_curve and to mlperf_power_regime above."
      - "Llama-3.1-405B hardware conflict inside the source paper itself: Section IV-B prose states its 405B batch=1/batch=100 case study ran on '2 x 8 NVIDIA A100 80GB GPUs' (16x A100), but Table IV's row for the same model lists 'NVIDIA H100 80GB HBM3', count 16. Both are recorded below, each labeled exactly as the paper states in its own respective location; the discrepancy is not resolved further here."
      - "Table IV's 'optimized' batch is not given as a number; do not conflate the Table IV optimized-batch point with the Section IV-B prose's explicit batch=100 point -- they are two distinct points on the curve (100 vs an unstated, evidently larger, batch)."
      - "Table IV's Energy/Energy1 units are not explicitly labeled inside the table; inferred as Wh per prompt from consistency of magnitude and methodology with the labeled-Wh Figure 3 / Section IV-B prose immediately preceding it."
      - "QwQ-32B, Qwen1.5-32B-Chat and fin-llama-33b-merged (32.5-32.8B) are below this file's 65B+ cloud target; included as SECONDARY/supplementary points per instructions, flagged explicitly on each entry -- do not treat as primary 70B-class evidence."
      - "facebook/opt-66b (65.72B) and Qwen2.5-72B (72.71B) bracket the 65-70B+ target closely; Meta-Llama-3-70B (70.55B) is the closest exact size match to this file's existing Llama-3.1-70B/Llama-2-70B cloud references, but Table IV gives it only the optimized-batch point, no batch=1 companion."
    batch_curve:
      - hardware: "16x A100 80GB (2x8 nodes, per Section IV-B prose)"
        model: "Llama-3.1-405B"
