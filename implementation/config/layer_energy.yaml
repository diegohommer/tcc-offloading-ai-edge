link:
  description: "ONU/PON access-network hop energy -- three orders of magnitude below inference terms, second-order for routing decisions."
  onu_power_active_W: 3.98
  onu_power_dozing_W: 1.2
  onu_power_sleep_W: 0.4
  onu_share_of_ftth_consumption_pct: 60
  per_hop_energy_J: 0.1
  sources:
    - "Loading-Aware TDMA Sleep (MDPI Sustainability), https://www.mdpi.com/2071-1050/14/16/10238"
    - "Sarigiannidis et al., IET Networks 2016, https://ietresearch.onlinelibrary.wiley.com/doi/10.1049/iet-net.2015.0087"
    - "FTTH EE analysis (PMC), https://pmc.ncbi.nlm.nih.gov/articles/PMC12526558/"

# =============================================================================
# PREFILL: energia por token de ENTRADA, por camada
# =============================================================================
# Convencao da area (Solovyeva & Castor; TokenPowerBench; arXiv:2605.11999):
# reportar as fases separadamente, com denominadores distintos -- tokens de
# ENTRADA para prefill, tokens de SAIDA para decode. E a forma que
# src/energy/cost.py ja implementa:
#
#     E_query = E_pf_per_token * n_prompt  +  E_dec_per_token * n_gen
#
# Antes deste bloco, E_pf_J_per_token era None em todas as camadas e o custo
# so podia ser calculado por decode. Isso era aceitavel no regime CoT original
# (~50 tokens de prompt para ~200 gerados) e deixou de ser no regime do replay
# do leaderboard (~1000 de prompt para 34-90 gerados), onde o prefill deixa de
# ser segunda ordem.
#
# A RAZAO prefill:decode VARIA COM O BACKEND, e nao e ruido. Prefill e
# compute-bound e decode e memory-bound, entao CPU (ruim em compute, bom em
# banda) tem prefill comparativamente CARO, e GPU tem prefill baratissimo.
# Cai et al. enunciam o mecanismo: "NPUs excel at compute-bound prefilling,
# while CPUs outperform all other backends in memory-bound decoding."
prefill:
  user:
    J_per_input_token: 0.016
    evidence: measured
    source: "Cai et al., Is Your NPU Ready for LLMs?, arXiv:2607.05475, Table 5 ('Averaged Throughput and Energy across Devices, Models, Frameworks, and Backends with 256 tokens'), row Llama3.2-1B / CPU / llama.cpp / w4, column OnePlus 15."
    raw: "1.6e4 uJ/token prefill against 7.4e4 uJ/token decode -- the decode figure is exactly the 0.074 this file already prices the user tier with, confirming the same row."
    ratio_to_decode: 0.216          # 1 : 4.6
    note: >
      The most expensive prefill of the four tiers, relatively speaking,
      because the user tier decodes on CPU. Table 5's NPU rows are far cheaper
      for prefill (MLLM w4a16: 3.2e3 uJ/token, a 1:23 ratio against CPU
      decode), so a deployment splitting phases across backends would pay much
      less. This file prices the single-backend CPU case actually run.

  onu:
    J_per_input_token: 0.0009
    evidence: measured
    source: "EdgeReasoning artifact, Zenodo doi:10.5281/zenodo.17168238, validation/prefill.json, model DeepSeek_R1_Distill_Qwen_1.5B. Metadata states: 'Measured prefill traces: energy per token (J), plus raw timing/power columns.' 33 points, input lengths 3 to 897 tokens."
    raw: "median 0.00090 J/token (min 0.00087, max 0.06733 -- the max is the 3-token case, where fixed overhead dominates the denominator)."
    ratio_to_decode: 0.0041         # 1 : 244
    note: >
      Same Zenodo artifact as this file's onu decode source, so both phases
      come from one measurement campaign on one device. The companion file
      validation/decode.json covers Qwen-1.5B and Qwen-14B.
      Cross-check: Llama-8B prefill is 0.0200 and Qwen-14B is 0.0456 J/token,
      so prefill cost rises with model size roughly in line with decode.

  fog:
    J_per_input_token: 0.033
    evidence: derived
    source: "Solovyeva and Castor, Towards Green AI (thesis/papers/TowardsGreenLLM.pdf), Table 2 (mean prefill contribution to total inference energy) with Table 3 (mean input tokens), measured on an NVIDIA A10 24GB via pyNVML -- the same hardware class this file declares for fog."
    derivation: >
      Table 2 gives prefill's share of total energy per workload, not J/token.
      Inverting share = (n_in * e_pf) / (n_in * e_pf + n_out * e_dec) for
      CodeGemma-7B, the closest family match to the fog tier's Gemma-2-9B:
      0-shot (155 in, 300 out max, 1.2% share) gives e_dec/e_pf = 42.5;
      2-shot (559 in, 300 out max, 2.8% share) gives 64.7. Taking ~53 as the
      ratio and applying it to this file's fog decode anchor of 1.75 J/token
      yields 0.033 J per input token.
    ratio_to_decode: 0.019          # 1 : 53
    caveats:
      - "Derived from a percentage, not read from a J/token table."
      - "CodeGemma-7B on A10, not Gemma-2-9B on L4: same family lineage and same declared hardware class, not the same model."
      - "The 300-output cases are used because they are the reliable regime; Table 2's CU case (max 10 output tokens) gives prefill shares of 64.9-84.4% and a much larger implied ratio, but with only ten output tokens the denominator is too small to invert stably."

  cloud:
    # ATENCAO: a ancora de decode da nuvem (Caravaca, 1.002 J/token) E misturada
    # -- aquele paper declara explicitamente "no separate prefill/decode phase
    # breakdown reported due to continuous batching". Somar este valor por cima
    # dela conta o prefill DUAS VEZES. O erro e pequeno (2.36 J num total de
    # 85.5 J por consulta, ~3%) e a direcao e conservadora, mas e erro.
    # A correcao adequada e decompor os 1.002 usando a razao 1:370 em vez de
    # somar; nao foi feita porque exigiria saber o n_in/n_gen do regime em que
    # o Caravaca mediu, que o paper nao declara.
    # Contraste com o fog: la o Bench360 mede "Power x generation time", entao
    # a soma separada e correta.
    double_counts_against_decode_anchor: true
    J_per_input_token: 0.0027
    evidence: derived
    source: "The Illusion of Power Capping in LLM Decode: A Phase-Aware Energy Characterisation Across Attention Architectures, arXiv:2605.11999, NVIDIA H200. States its primary metric explicitly: 'energy per token (mJ/tok), measured separately for prefill and decode. For prefill, the denominator is the number of input tokens processed.'"
    derivation: >
      The paper reports decode at 107-242 mJ/token for GQA (the attention
      architecture Llama-3-70B uses) across 4K-16K context, and states that at
      BS=32/16K "Mamba2's prefill costs ~35x more energy per token than GQA --
      but the absolute difference is only ~10 mJ/tok, because prefill is
      already extremely cheap". Solving 35x - x = 10 gives GQA prefill ~0.29
      mJ/token, a ratio of roughly 1:370 against its own decode. Applying that
      ratio to this file's cloud decode anchor of 1.002 J/token gives 0.0027 J
      per input token.
    ratio_to_decode: 0.0027         # 1 : 370
    caveats:
      - "H200 single GPU, not the 4xH100 of the cloud decode anchor."
      - "The ratio is read from a prose comparison, not from a tabulated prefill row."
      - >
        SUPERSEDES an analytical estimate. From Tokens to Watt-hours
        (arXiv:2607.26571) Table 3 gives Llama-3.3-70B on H100 as 262.080
        mJ per input token against 218.400 mJ per output token -- prefill more
        expensive than decode, the opposite sign. That paper is an analytical
        estimator and states it does not validate the 70B phase split
        empirically, only aggregate request energy. Where an analytical
        estimate and a measurement disagree on sign, this file takes the
        measurement. The analytical figure is recorded here so the
        contradiction is documented rather than silently dropped.

  regime_note: >
    All four values are per token of INPUT and must be multiplied by prompt
    length, never by generated length. In this repo's leaderboard-replay regime
    (~1000 prompt tokens against 34-90 generated), prefill's share of each
    tier's energy is roughly: user 86%, fog 20%, cloud 3%, onu 5%. The user
    tier is prefill-DOMINATED, which is the opposite of the assumption the
    proposal's section 7.1 carried before this block existed.

environment:
  pue:
    hyperscale: 1.1
    average: 1.5
  applies_to: [fog, cloud]

# ---------------------------------------------------------------------------
# Locally measured energy -- NOT part of the literature tables above.
# ---------------------------------------------------------------------------
# Everything above this line is transcribed from published sources measuring
# decoder LLMs (1B-405B params) on hardware this project does not have. The
# block below is the opposite: energy this project measured itself, on the
# tiny encoder classifiers that the RecServe harness actually runs.
#
# Recorded here because it is NOT regenerable from the repo -- it depends on
# one specific machine, its thermal state, and root-granted RAPL access. The
# generated JSON it came from (results/traces/measured_tier_energy.json) is
# not version-controlled.
#
# DO NOT MIX WITH THE TABLES ABOVE. Different unit (J per PROMPT token on a
# single forward pass, vs J per OUTPUT token during decode), different model
# class (66M-400M encoders vs 1B-405B decoders), different boundary (CPU
# package vs chip/module or node).
local_measurement:
  date: 2026-08-29
  hardware: "Intel Core 5 120U, 12 threads, CPU-only inference (no GPU on this machine)"
  method: >
    Intel RAPL sysfs counter deltas (wraparound-corrected) around real
    inference, via src/scripts/measure_tier_energy.py. Idle power sampled for
    5s immediately before the run and subtracted to give the 'net' figures.
    3 measured passes per tier, 40 SST-2 queries (1010 prompt tokens) per
    pass, 5 unmeasured warmup inferences before each pass.
  domain: package-0
  idle_W: {package-0: 9.66, psys: 18.99}
  unit: J_per_prompt_token
  phase: single_forward_pass_no_generation
  tiers:
    user:
      model: "azizbarank/distilroberta-base-sst2-distilled (~82M)"
      net_J_per_inference: 0.2195
      net_J_per_prompt_token: 0.00869
      total_J_per_inference: 0.4212
      net_J_stdev_across_passes: 1.70
    onu:
      model: "textattack/roberta-base-SST-2 (~125M)"
      net_J_per_inference: 0.3899
      net_J_per_prompt_token: 0.01544
      total_J_per_inference: 0.6953
      net_J_stdev_across_passes: 1.15
    fog:
      model: "howey/roberta-large-sst2 (~355M)"
      net_J_per_inference: 1.7465
      net_J_per_prompt_token: 0.06917
      total_J_per_inference: 2.8872
      net_J_stdev_across_passes: 4.60
    cloud:
      model: "Tomor0720/deberta-large-finetuned-sst2 (~400M)"
      net_J_per_inference: 2.2323
      net_J_per_prompt_token: 0.08841
      total_J_per_inference: 4.1175
      net_J_stdev_across_passes: 20.93
  caveats:
    - "Package-scope: counts any other load on the socket. Run on a quiet machine."
    - >
      'net' subtracts measured idle power; 'total' does not. Neither is
      definitive -- total overstates the model's own marginal cost on a mostly
      idle machine, net understates it if inference also raises the subtracted
      components. Both recorded.
    - >
      The cloud tier's spread is large (stdev 20.93 J across passes; pass 1 read
      113 J against ~77 J for passes 2-3), consistent with thermal/turbo
      settling. The larger models want a longer warmup than the 5 inferences
      used here. user/onu were stable by comparison.
    - >
      Ladder is monotonic (0.00869 / 0.01544 / 0.06917 / 0.08841) with a ~10x
      user-to-cloud spread -- roughly twice the ~5.4x spread implied by the
      borrowed literature values used before this was measured.
