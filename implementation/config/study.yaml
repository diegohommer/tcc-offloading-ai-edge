# The case study's settings (energy_tests.md §9): RecServe, the timetable and the
# broadcast policy (the OLT's cost broadcast on the PON). Everything not listed here is
# config/simulation.yaml's default, which is also where the realism settings live
# (published answer lengths, escalation at beta, one RecServe window per household,
# follow-ups after the answer with their context, the ONU's queue, uneven households);
# each value below says why the study uses it. run_study.sh varies only the seed and the
# few settings its sensitivity runs name.
extends: simulation.yaml

traffic:
  # The case study's OLT. 10,000 households is a mid-size deployment, within what a
  # single chassis carries, and it is where the OLT starts batching properly: below
  # about 2,000 it almost never holds two queries at once and every answer pays the
  # lonely rate. run_study.sh sweeps the rest of the range. [swept]
  subscribers: [1000, 2000, 5000, 10000, 20000]

energy:
  # Only what a query adds: the energy a routing decision actually changes.
  # [choice; average accounting in the sensitivity runs]
  accounting: marginal

policy:
  # RecServe; RecServe without the ONU (control); the OLT's cost from a timetable, one
  # rate per hour of a weekday or weekend day (static_hour); the OLT's cost broadcast on
  # the PON (broadcast: the proposal); the OLT's rate heard only on the household's own
  # answers (piggyback: ablation); each tier answering every query alone (references).
  policies: [recserve, recserve_no_onu, static_hour, broadcast, piggyback, user_alone, onu_alone, olt_alone]
  # The timetable is relearned while it runs, since it changes the load it describes,
  # as the thesis describes it. [choice]
  calibration: self

learning:
  # Weight on each OLT rate a household hears on its own answers (piggyback). [choice]
  rate_alpha: 0.3

report:
  # The OLT reports over its last 5 minutes, on answers (piggyback) and in its
  # broadcast alike. [choice]
  report: window

output:
  no_hourly: true
