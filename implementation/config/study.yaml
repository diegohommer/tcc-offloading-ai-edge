# The case study's settings (energy_tests.md §9): RecServe, the static tables and
# the broadcast policy (the OLT's cost broadcast on the PON). Everything not listed
# here is config/simulation.yaml's default; each value below says why the study
# uses it. run_study.sh varies only
# the seed and the few settings its sensitivity runs name.
extends: simulation.yaml

traffic:
  # The case study's OLT. 10,000 households is a mid-size deployment, within what a
  # single chassis carries, and it is where the OLT starts batching properly: below
  # about 2,000 it almost never holds two queries at once and every answer pays the
  # lonely rate. run_study.sh sweeps the rest of the range. [swept]
  subscribers: [1000, 2000, 5000, 10000, 20000]

energy:
  # Only what a query adds: the energy a routing decision actually changes.
  # [choice; average accounting in the sensitivity runs]
  accounting: marginal

policy:
  # RecServe; RecServe without the ONU (control); the OLT's cost from a table set in
  # advance, one rate per day (static_day) or per hour (static_hour, the timetable);
  # the OLT's cost broadcast on the PON (broadcast: the proposal); the oracle (the
  # broadcast with no delay); broadcast fed only by the household's own answers
  # (piggyback: ablation).
  policies: [recserve, recserve_no_onu, static_day, static_hour, broadcast, oracle, piggyback]

learning:
  # Question statistics pooled across households, for every energy-aware policy
  # alike, so they differ only in where the OLT's cost comes from. [choice; per
  # household in the ablation]
  shared_stats: true
  # Weight on each OLT rate a household hears on its own answers (piggyback). [choice]
  rate_alpha: 0.3

report:
  # The OLT reports over its last 5 minutes, on answers (piggyback) and in its
  # broadcast alike. [choice]
  report: window

output:
  no_hourly: true
